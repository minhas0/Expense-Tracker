<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#16181a;--mute:#6b7075;--line:#e8e8e3;--acc:#0f766e;--accink:#fff;--exp:#c2410c;--inc:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0e1011;--card:#171a1c;--ink:#ecedee;--mute:#8b9197;--line:#262a2d;--acc:#2dd4bf;--accink:#042f2a;--exp:#fb923c;--inc:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:4px;margin-bottom:12px}
header .nav{width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--mute)}
header .nav:active{background:var(--line)}
#label{flex:1;text-align:center;font-weight:600;font-size:17px}
#sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
#sum .big{font-size:34px;font-weight:700;letter-spacing:-.5px;color:var(--exp)}
#sum .cap{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#sum .two{display:flex;gap:24px;margin-top:12px}
#sum .two b{display:block;font-size:17px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
h3{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .dot{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--mute);flex:none}
.row .t{flex:1;min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--mute)}
.row .a{font-weight:600;font-variant-numeric:tabular-nums}
.dayh{display:flex;justify-content:space-between;padding:0 4px;margin:18px 0 6px;color:var(--mute);font-size:13px;width:100%}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:14px 0;color:var(--mute);font-weight:600}
nav button.on{color:var(--acc)}
#fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(72px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--accink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#more{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,calc(50% - 268px))}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:92vh;overflow:auto}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
#amt{font-size:32px;font-weight:700;border:0;background:none;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.btns .primary{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btns .danger{color:var(--exp)}
.note{font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.loansv #prev,.loansv #next{visibility:hidden}
.row small.note{display:block;margin-top:4px}
.big2{font-size:30px;font-weight:700;letter-spacing:-.5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="nav" id="prev" aria-label="Previous">‹</button>
    <div id="label"></div>
    <button class="nav" id="next" aria-label="Next">›</button>
    <span style="width:40px"></span>
  </header>
  <button class="nav" id="more" aria-label="Menu" style="width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--mute)">⋯</button>
  <section id="sum"></section>
  <main id="content"></main>
</div>
<button id="fab" aria-label="Add">+</button>
<nav><div class="in">
  <button data-v="day">Day</button><button data-v="month">Month</button><button data-v="year">Year</button><button data-v="loans">Loans</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel">
  <div class="seg" id="seg"><button data-t="expense">Expense</button><button data-t="income">Income</button></div>
  <input id="amt" inputmode="decimal" placeholder="0" autocomplete="off">
  <div class="chips" id="cats"></div>
  <input id="note" placeholder="Note (optional)" maxlength="80" autocomplete="off">
  <input id="date" type="date">
  <div class="btns">
    <button id="del" class="danger" hidden>Delete</button>
    <button id="cancel">Cancel</button>
    <button id="save" class="primary">Save</button>
  </div>
</div></div>

<div class="sheet" id="menu" hidden><div class="panel">
  <label class="note">Currency
    <select id="cursel"><option>₹</option><option>$</option><option>€</option><option>£</option></select>
  </label>
  <div class="btns"><button id="expjson">Backup (JSON)</button><button id="expcsv">Export CSV</button></div>
  <div class="btns"><button id="imp">Restore backup</button></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <p class="note">Your data (including loans) lives only in this browser on this phone. Clearing site data or uninstalling can erase it, so back up now and then.</p>
  <div class="btns"><button id="closemenu" class="primary">Done</button></div>
</div></div>
<div class="sheet" id="lsheet" hidden><div class="panel">
  <div class="seg" id="lseg"><button data-d="lent">I lent</button><button data-d="borrowed">I borrowed</button></div>
  <input id="lperson" placeholder="Person" maxlength="40" autocomplete="off">
  <input id="lamt" inputmode="decimal" placeholder="Amount" autocomplete="off" style="font-size:28px;font-weight:700">
  <input id="lnote" placeholder="Note (optional)" maxlength="80" autocomplete="off">
  <input id="ldate" type="date">
  <div class="btns"><button id="lcancel">Cancel</button><button id="lsave" class="primary">Save</button></div>
</div></div>

<div class="sheet" id="dsheet" hidden><div class="panel" id="dbody"></div></div>
<div id="toast"></div>

<script>
(()=>{
const KEY='ledger.v1',CKEY='ledger.cur',LKEY='ledger.loans.v1';
const CATS={expense:['Food','Transport','Rent','Bills','Shopping','Health','Fun','Education','Other'],income:['Salary','Allowance','Freelance','Gift','Other']};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
let tx=[],cur='₹',view='day',cursor=new Date(),editing=null,form={type:'expense',cat:'Food'};
cursor.setHours(12,0,0,0);
let loans=[],ledit=null,lf={dir:'lent'},dcur=null;
const money=n=>cur+nf.format(n);

function load(){
  try{tx=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(tx))tx=[]}catch(e){tx=[]}
  try{cur=localStorage.getItem(CKEY)||'₹'}catch(e){}
  try{loans=JSON.parse(localStorage.getItem(LKEY)||'[]');if(!Array.isArray(loans))loans=[]}catch(e){loans=[]}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){toast('Could not save')}}
function saveLoans(){try{localStorage.setItem(LKEY,JSON.stringify(loans))}catch(e){toast('Could not save')}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}

const keyOf=()=>view==='day'?iso(cursor):view==='month'?iso(cursor).slice(0,7):String(cursor.getFullYear());
const labelOf=()=>view==='day'?DOW[cursor.getDay()]+', '+cursor.getDate()+' '+MON[cursor.getMonth()]+' '+cursor.getFullYear()
  :view==='month'?MON[cursor.getMonth()]+' '+cursor.getFullYear():String(cursor.getFullYear());
const sum=l=>l.reduce((a,t)=>{t.type==='income'?a.inc+=t.amount:a.exp+=t.amount;return a},{inc:0,exp:0});

function item(t){
  return `<button class="row" data-id="${t.id}"><span class="dot">${esc(t.cat.slice(0,2))}</span>
  <span class="t"><div>${esc(t.note||t.cat)}</div>${t.note?`<small>${esc(t.cat)}</small>`:''}</span>
  <span class="a ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span></button>`;
}
function catHtml(list){
  const m={};list.filter(t=>t.type==='expense').forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!e.length)return'';
  const tot=e.reduce((a,x)=>a+x[1],0);
  return `<h3>Where it went</h3><div class="card">`+e.map(([c,v])=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${(v/tot*100).toFixed(1)}%"></i></div></div>`).join('')+`</div>`;
}
function groupedHtml(list){
  const g={};list.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  return Object.keys(g).sort().reverse().map(d=>{
    const dt=parse(d),s=sum(g[d]);
    return `<button class="dayh" data-day="${d}"><span>${DOW[dt.getDay()]}, ${dt.getDate()} ${MON[dt.getMonth()]}</span><span>${s.exp?'−'+money(s.exp):''}</span></button><div class="card">${g[d].map(item).join('')}</div>`;
  }).join('');
}
function yearHtml(list){
  const y=cursor.getFullYear(),arr=[];
  for(let m=0;m<12;m++){const p=y+'-'+pad(m+1);arr.push({p,m,...sum(list.filter(t=>t.date.startsWith(p)))})}
  const max=Math.max(1,...arr.map(a=>a.exp));
  return `<h3>By month</h3><div class="card">`+arr.map(a=>`<button class="row" data-month="${a.p}" style="display:block"><div style="display:flex;justify-content:space-between"><span>${MON[a.m]}</span><span><b class="exp">${a.exp?money(a.exp):'—'}</b>${a.inc?` <small class="inc">+${money(a.inc)}</small>`:''}</span></div><div class="bar"><i style="width:${(a.exp/max*100).toFixed(1)}%"></i></div></button>`).join('')+`</div>`;
}
function render(){
  $('#app').classList.toggle('loansv',view==='loans');
  if(view==='loans')return renderLoans();
  const key=keyOf();
  const list=tx.filter(t=>t.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const s=sum(list);
  $('#label').textContent=labelOf();
  $('#sum').innerHTML=`<div class="cap">Spent</div><div class="big">${money(s.exp)}</div>
    <div class="two"><div><span class="cap">Income</span><b class="inc">${money(s.inc)}</b></div><div><span class="cap">Net</span><b>${s.inc-s.exp<0?'−':''}${money(Math.abs(s.inc-s.exp))}</b></div></div>`;
  let h='';
  if(view==='day')h=list.length?`<div class="card">${list.map(item).join('')}</div>`:'';
  if(view==='month')h=list.length?catHtml(list)+groupedHtml(list):'';
  if(view==='year')h=list.length?yearHtml(list)+catHtml(list):'';
  $('#content').innerHTML=h||`<div class="empty">Nothing here yet.<br>Tap + to add one.</div>`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}

const fmt=d=>{const t=parse(d);return t.getDate()+' '+MON[t.getMonth()]+' '+t.getFullYear()};
const paid=l=>l.payments.reduce((a,p)=>a+p.amount,0);
const left=l=>Math.round((l.amount-paid(l))*100)/100;
function loanRow(l){
  const r=left(l),p=paid(l);
  return `<button class="row" data-loan="${l.id}" style="display:block"><div style="display:flex;align-items:center;gap:12px"><span class="dot">${esc(l.person.slice(0,2).toUpperCase())}</span><span class="t"><div>${esc(l.person)}</div><small>${l.note?esc(l.note)+' · ':''}${fmt(l.date)}</small></span><span class="a ${l.dir==='lent'?'inc':'exp'}">${money(r)}</span></div>${p>0&&r>0?`<div class="bar"><i style="width:${(p/l.amount*100).toFixed(1)}%"></i></div><small class="note">${money(p)} of ${money(l.amount)} returned</small>`:''}</button>`;
}
function renderLoans(){
  const open=loans.filter(l=>left(l)>0).sort((a,b)=>a.date.localeCompare(b.date));
  const done=loans.filter(l=>left(l)<=0).sort((a,b)=>b.date.localeCompare(a.date));
  const lent=open.filter(l=>l.dir==='lent'),bor=open.filter(l=>l.dir==='borrowed');
  const tot=a=>Math.round(a.reduce((s,l)=>s+left(l),0)*100)/100;
  $('#label').textContent='Loans';
  $('#sum').innerHTML=`<div class="cap">To get back</div><div class="big" style="color:var(--inc)">${money(tot(lent))}</div>
    <div class="two"><div><span class="cap">I owe</span><b class="exp">${money(tot(bor))}</b></div><div><span class="cap">People pending</span><b>${new Set(lent.map(l=>l.person.trim().toLowerCase())).size}</b></div></div>`;
  const sec=(t,a)=>a.length?`<h3>${t}</h3><div class="card">${a.map(loanRow).join('')}</div>`:'';
  $('#content').innerHTML=(sec('Money I lent',lent)+sec('Money I borrowed',bor)+sec('Settled',done))||`<div class="empty">No loans yet.<br>Tap + to add one.</div>`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}
function drawLF(){document.querySelectorAll('#lseg button').forEach(b=>b.classList.toggle('on',b.dataset.d===lf.dir))}
function openLoanForm(l){
  ledit=l||null;lf={dir:l?l.dir:'lent'};
  $('#lperson').value=l?l.person:'';
  $('#lamt').value=l?l.amount:'';
  $('#lnote').value=l?l.note:'';
  $('#ldate').value=l?l.date:iso(new Date());
  drawLF();$('#lsheet').hidden=false;
  setTimeout(()=>$('#lperson').focus(),50);
}
function saveLoanForm(){
  const person=$('#lperson').value.trim();
  const amount=Math.round(parseFloat(String($('#lamt').value).replace(/,/g,''))*100)/100;
  const date=$('#ldate').value;
  if(!person){toast('Enter a name');return}
  if(!(amount>0)){toast('Enter an amount');return}
  if(!date){toast('Pick a date');return}
  if(ledit&&amount<paid(ledit)){toast('Less than already repaid');return}
  const rec={dir:lf.dir,person,amount,note:$('#lnote').value.trim(),date};
  if(ledit)Object.assign(ledit,rec);else loans.push({id:Date.now(),...rec,payments:[]});
  saveLoans();$('#lsheet').hidden=true;ledit=null;render();
}
function openDetail(id){
  dcur=loans.find(l=>String(l.id)===String(id));
  if(!dcur)return;
  drawDetail();$('#dsheet').hidden=false;
}
function drawDetail(){
  const l=dcur,r=left(l);
  $('#dbody').innerHTML=`<div><div style="font-size:20px;font-weight:700">${esc(l.person)}</div><div class="note">${l.dir==='lent'?'I lent':'I borrowed'} ${money(l.amount)} · ${fmt(l.date)}${l.note?' · '+esc(l.note):''}</div></div>
  <div><div class="cap note">${r>0?(l.dir==='lent'?'Still to get back':'Still to pay'):'Settled'}</div><div class="big2 ${l.dir==='lent'?'inc':'exp'}">${money(r)}</div></div>
  ${l.payments.length?`<div class="card">${l.payments.map(x=>`<div class="row"><span class="t"><div>${fmt(x.date)}</div></span><span class="a">${money(x.amount)}</span><button data-delpay="${x.id}" aria-label="Remove repayment" style="color:var(--mute);padding:0 6px;font-size:20px">×</button></div>`).join('')}</div>`:''}
  ${r>0?`<input id="pamt" inputmode="decimal" placeholder="${l.dir==='lent'?'Amount received back':'Amount paid back'}" autocomplete="off"><input id="pdate" type="date" value="${iso(new Date())}"><div class="btns"><button id="psettle">Full ${money(r)}</button><button id="prec" class="primary">Record</button></div>`:''}
  <div class="btns"><button id="dd" class="danger">Delete</button><button id="de">Edit</button><button id="dc">Close</button></div>`;
}

function shift(dir){
  const y=cursor.getFullYear(),m=cursor.getMonth(),d=cursor.getDate();
  cursor=view==='day'?new Date(y,m,d+dir,12):view==='month'?new Date(y,m+dir,1,12):new Date(y+dir,0,1,12);
  render();
}
function setView(v){
  const now=new Date();now.setHours(12,0,0,0);
  if(v==='day'&&view!=='day'&&(cursor.getFullYear()!==now.getFullYear()||cursor.getMonth()!==now.getMonth()))cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1,12);
  else if(v==='day'&&view!=='day')cursor=now;
  view=v;render();
}

function drawForm(){
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===form.type));
  if(!CATS[form.type].includes(form.cat))form.cat=CATS[form.type][0];
  $('#cats').innerHTML=CATS[form.type].map(c=>`<button data-c="${c}" class="${c===form.cat?'on':''}">${c}</button>`).join('');
}
function openSheet(t){
  editing=t||null;
  const now=new Date();
  form={type:t?t.type:'expense',cat:t?t.cat:'Food'};
  $('#amt').value=t?t.amount:'';
  $('#note').value=t?t.note:'';
  $('#date').value=t?t.date:iso(view==='day'?cursor:now);
  $('#del').hidden=!t;
  drawForm();
  $('#sheet').hidden=false;
  setTimeout(()=>$('#amt').focus(),50);
}
function closeSheet(){$('#sheet').hidden=true;editing=null}
function saveForm(){
  const amount=parseFloat(String($('#amt').value).replace(/,/g,''));
  const date=$('#date').value;
  if(!(amount>0)){toast('Enter an amount');return}
  if(!date){toast('Pick a date');return}
  const rec={type:form.type,cat:form.cat,amount:Math.round(amount*100)/100,note:$('#note').value.trim(),date};
  if(editing)Object.assign(editing,rec);else tx.push({id:Date.now(),...rec});
  save();closeSheet();
  if(view==='day')cursor=parse(date);render();
}

function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const csvCell=v=>'"'+String(v).replace(/"/g,'""')+'"';
function exportCsv(){
  const rows=['date,type,category,amount,note',...tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.cat,t.amount,csvCell(t.note)].join(','))];
  download('ledger-'+iso(new Date())+'.csv',rows.join('\n'),'text/csv');
}
function importJson(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const arr=Array.isArray(d)?d:(Array.isArray(d.tx)?d.tx:[]);
      const ok=arr.filter(t=>t&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&t.amount>0&&(t.type==='expense'||t.type==='income')).map((t,i)=>({id:t.id||Date.now()+i,type:t.type,cat:String(t.cat||'Other'),amount:Number(t.amount),note:String(t.note||''),date:t.date}));
      const have=new Set(tx.map(t=>t.id));
      const add=ok.filter(t=>!have.has(t.id));
      tx=tx.concat(add);save();
      const dateOk=x=>/^\d{4}-\d{2}-\d{2}$/.test(x);
      const la=Array.isArray(d.loans)?d.loans:[];
      const haveL=new Set(loans.map(l=>l.id));
      const addL=la.filter(l=>l&&String(l.person||'').trim()&&l.amount>0&&(l.dir==='lent'||l.dir==='borrowed')&&dateOk(l.date)).map((l,i)=>({id:l.id||Date.now()+1000+i,dir:l.dir,person:String(l.person).trim(),amount:Number(l.amount),note:String(l.note||''),date:l.date,payments:(Array.isArray(l.payments)?l.payments:[]).filter(p=>p&&p.amount>0&&dateOk(p.date)).map((p,j)=>({id:p.id||Date.now()+j,amount:Number(p.amount),date:p.date}))})).filter(l=>!haveL.has(l.id));
      loans=loans.concat(addL);saveLoans();render();toast('Restored '+(add.length+addL.length)+' entries');
    }catch(e){toast('Not a valid backup file')}
  };
  r.readAsText(file);
}

$('#prev').onclick=()=>shift(-1);
$('#next').onclick=()=>shift(1);
$('#fab').onclick=()=>view==='loans'?openLoanForm():openSheet();
$('#more').onclick=()=>{$('#cursel').value=cur;$('#menu').hidden=false};
$('#closemenu').onclick=()=>$('#menu').hidden=true;
$('#cancel').onclick=closeSheet;
$('#save').onclick=saveForm;
$('#del').onclick=()=>{if(editing&&confirm('Delete this entry?')){tx=tx.filter(t=>t!==editing);save();closeSheet();render()}};
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b){form.type=b.dataset.t;drawForm()}};
$('#cats').onclick=e=>{const b=e.target.closest('button');if(b){form.cat=b.dataset.c;drawForm()}};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').hidden=true};
$('#cursel').onchange=e=>{cur=e.target.value;try{localStorage.setItem(CKEY,cur)}catch(x){}render()};
$('#expjson').onclick=()=>download('ledger-backup-'+iso(new Date())+'.json',JSON.stringify({v:2,tx,loans},null,1),'application/json');
$('#expcsv').onclick=exportCsv;
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value=''};
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};
$('#content').onclick=e=>{
  const r=e.target.closest('[data-id]');
  if(r){const t=tx.find(x=>String(x.id)===r.dataset.id);if(t)openSheet(t);return}
  const d=e.target.closest('[data-day]');if(d){cursor=parse(d.dataset.day);view='day';render();return}
  const m=e.target.closest('[data-month]');if(m){cursor=parse(m.dataset.month+'-01');view='month';render()}
};

$('#lseg').onclick=e=>{const b=e.target.closest('button');if(b){lf.dir=b.dataset.d;drawLF()}};
$('#lcancel').onclick=()=>{$('#lsheet').hidden=true;ledit=null};
$('#lsheet').onclick=e=>{if(e.target.id==='lsheet'){$('#lsheet').hidden=true;ledit=null}};
$('#lsave').onclick=saveLoanForm;
$('#content').addEventListener('click',e=>{const r=e.target.closest('[data-loan]');if(r)openDetail(r.dataset.loan)});
$('#dsheet').onclick=e=>{
  if(e.target.id==='dsheet'){$('#dsheet').hidden=true;return}
  const b=e.target.closest('button');if(!b||!dcur)return;
  const l=dcur;
  if(b.id==='dc'){$('#dsheet').hidden=true}
  else if(b.id==='de'){$('#dsheet').hidden=true;openLoanForm(l)}
  else if(b.id==='dd'){if(confirm('Delete this loan and its repayments?')){loans=loans.filter(x=>x!==l);saveLoans();$('#dsheet').hidden=true;dcur=null;render()}}
  else if(b.id==='psettle'){$('#pamt').value=left(l)}
  else if(b.id==='prec'){
    const a=Math.round(parseFloat(String($('#pamt').value).replace(/,/g,''))*100)/100,d=$('#pdate').value;
    if(!(a>0)){toast('Enter an amount');return}
    if(!d){toast('Pick a date');return}
    if(a>left(l)){toast('More than the balance');return}
    l.payments.push({id:Date.now(),amount:a,date:d});
    saveLoans();drawDetail();render();
  }
  else if(b.dataset.delpay){l.payments=l.payments.filter(x=>String(x.id)!==b.dataset.delpay);saveLoans();drawDetail();render()}
};

load();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__ledger={get tx(){return tx},get loans(){return loans},setView,shift,openSheet,saveForm};
})();
</script>
</body>
</html>
